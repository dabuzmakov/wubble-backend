name: Backend checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wubble_tests
          POSTGRES_USER: wubble
          POSTGRES_PASSWORD: wubble
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WUBBLE_TEST_DB: Host=localhost;Port=5432;Database=wubble_tests;Username=wubble;Password=wubble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Wubble.slnx --configuration Release
      - run: dotnet run --project Wubble.MonitoringChecks --configuration Release --no-build
      - run: dotnet run --project Wubble.AuthChecks --configuration Release --no-build
