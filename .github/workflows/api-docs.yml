name: Publish API Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate OpenAPI
        run: |
          dotnet build Wubble.Api/Wubble.Api.csproj \
            --configuration Release \
            -p:OpenApiDocumentsDirectory="$GITHUB_WORKSPACE/generated"

      - name: Prepare documentation
        shell: bash
        run: |
          mkdir -p site
          cp Wubble.Api/Docs/index.html site/index.html

          mapfile -t specs < <(find generated -maxdepth 1 -name '*.json' -type f)

          if [ "${#specs[@]}" -ne 1 ]; then
            echo "Expected exactly one OpenAPI JSON, found ${#specs[@]}"
            exit 1
          fi

          cp "${specs[0]}" site/openapi.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4